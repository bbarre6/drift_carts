[package]
name = "drift_carts"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevy = { version = "0.19", features = ["wav"] }
rand = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# cargo run --features dev  -> much faster incremental builds while iterating
dev = ["bevy/dynamic_linking"]

# Bevy's own crates are slow to compile at debug opt-level; keep them optimized
# even in dev builds so framerate stays sane during iteration.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
